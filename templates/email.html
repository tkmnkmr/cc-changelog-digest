<!--
  LLM 向けメモ:
  - Gmail はほとんどの CSS を許容するが、classレベルの<style>は消える場合があるので
    全要素に style 属性でインラインCSSを付けている。この構造は変えないこと。
  - テーブルレイアウト（table/tr/td）のみで組む。flex/grid は使わない。
  - 画像が無い場合（push失敗などのフォールバック時）は {{CARD_BLOCK}} ブロックを
    丸ごと削除し、代わりに「画像なし」の一文をテキストで入れる。
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F4F5F7; padding:24px 0; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Segoe UI', sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#0F1115; border-radius:12px; overflow:hidden;">

        <!-- Header: 結論一文 -->
        <tr>
          <td style="padding:28px 32px 20px 32px; border-bottom:1px solid #2A2E38;">
            <div style="font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size:12px; color:#F5A623; letter-spacing:1px; margin:0 0 10px 0;">
              CLAUDE CODE CHANGELOG DIGEST
            </div>
            <div style="font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size:30px; font-weight:700; color:#E8EAED; margin:0 0 6px 0;">
              v{{VERSION}}
            </div>
            <!-- LLM: 結論一文。40字以内 -->
            <div style="font-size:16px; color:#E8EAED; line-height:1.6; margin:0;">
              {{HEADLINE}}
            </div>
          </td>
        </tr>

        <!-- LLM: card.png のURLが取得できた場合のみこのブロックを残す。取得できない場合はこの <tr> ごと削除し、
             代わりに「画像を生成できなかったため本文のみでお届けします」という一文を上のHeaderの下に追加する -->
        <tr id="CARD_BLOCK">
          <td style="padding:20px 32px 0 32px;">
            <a href="{{REPORT_URL}}" style="text-decoration:none;">
              <img src="{{CARD_URL}}" width="536" alt="Claude Code v{{VERSION}} まとめ画像"
                   style="display:block; width:100%; max-width:536px; height:auto; border-radius:10px; border:1px solid #2A2E38;">
            </a>
          </td>
        </tr>

        <!-- 3行でわかる -->
        <tr>
          <td style="padding:24px 32px 8px 32px;">
            <div style="font-size:13px; font-weight:700; color:#9AA1AC; letter-spacing:0.04em; margin:0 0 12px 0;">
              3行でわかる
            </div>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
              <!-- LLM: 各行50字以内。3行の <tr> をまとめて {{POINT_ROWS}} に置き換える。例:
                   <tr><td style="width:24px; font-family:ui-monospace,monospace; font-weight:800; color:#F5A623; padding:6px 8px 6px 0; vertical-align:top;">1</td><td style="padding:6px 0; font-size:14px; color:#E8EAED;">本文</td></tr> -->
              {{POINT_ROWS}}
            </table>
          </td>
        </tr>

        <!-- 注目トピック -->
        <tr>
          <td style="padding:20px 32px 8px 32px;">
            <div style="font-size:13px; font-weight:700; color:#9AA1AC; letter-spacing:0.04em; margin:0 0 12px 0;">
              注目トピック
            </div>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
              <!-- LLM: 破壊的変更/大幅アップデート/新モデルの3行。該当なしでも行は残し「該当なし」と書く。
                   tdの背景色はカテゴリ色: breaking=#E5484D, major=#A78BFA, model=#5B9DF9。
                   3行の <tr> をまとめて {{TOPIC_ROWS}} に置き換える -->
              {{TOPIC_ROWS}}
            </table>
          </td>
        </tr>

        <!-- 今日やること -->
        <tr>
          <td style="padding:20px 32px 8px 32px;">
            <div style="font-size:13px; font-weight:700; color:#9AA1AC; letter-spacing:0.04em; margin:0 0 10px 0;">
              今日やること
            </div>
            <div style="background-color:#1C1F27; border:1px solid #2A2E38; border-radius:10px; padding:14px 16px; font-size:14px; line-height:1.8; color:#E8EAED;">
              <!-- LLM: 「〜を使っている人 → 〜する」形式で1〜3件。無ければ「特別な対応は不要」 -->
              {{ACTION_TEXT}}
            </div>
          </td>
        </tr>

        <!-- CTA -->
        <tr>
          <td style="padding:24px 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="border-radius:8px; background-color:#F5A623;">
                  <a href="{{REPORT_URL}}" style="display:inline-block; padding:12px 22px; font-size:14px; font-weight:700; color:#1a0a0a; text-decoration:none;">
                    詳細資料を見る
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding:16px 32px 28px 32px; border-top:1px solid #2A2E38;">
            <div style="font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size:11px; color:#5B6270; line-height:1.9;">
              CHANGELOG: <a href="{{CHANGELOG_URL}}" style="color:#9AA1AC;">{{CHANGELOG_URL}}</a><br>
              Release: <a href="{{RELEASE_URL}}" style="color:#9AA1AC;">{{RELEASE_URL}}</a><br>
              Session: {{SESSION_ID}} ({{SESSION_TITLE}})
            </div>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
